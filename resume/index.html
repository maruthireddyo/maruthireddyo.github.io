<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maruthi Reddy | Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    .container { display: flex; flex-direction: column; height: 100vh; }
    iframe { flex: 1; width: 100%; border: none; }
    .nav { height: 50px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 15px; flex-shrink: 0; }
    .nav button { padding: 10px 24px; font-size: 14px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .nav button:hover { background: #2563eb; }
    .nav button:disabled { background: #64748b; cursor: not-allowed; }
    .nav span { color: white; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <iframe id="slideFrame" src="slide1.html"></iframe>
    <div class="nav">
      <button id="prev" onclick="navigate(-1)">← Previous</button>
      <span id="counter">1 / 6</span>
      <button id="next" onclick="navigate(1)">Next →</button>
    </div>
  </div>
  <script>
    let current = 1;
    const total = 6;
    function navigate(dir) {
      current += dir;
      if (current < 1) current = 1;
      if (current > total) current = total;
      document.getElementById('slideFrame').src = 'slide' + current + '.html';
      document.getElementById('counter').textContent = current + ' / ' + total;
      document.getElementById('prev').disabled = current === 1;
      document.getElementById('next').disabled = current === total;
    }
    document.getElementById('prev').disabled = true;
  </script>
</body>
</html>
