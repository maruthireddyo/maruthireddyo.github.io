<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maruthi Reddy | Resume</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    iframe { width: 100%; height: calc(100vh - 60px); border: none; display: block; }
    .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #1e293b; display: flex; justify-content: center; align-items: center; gap: 20px; }
    .nav button { padding: 12px 30px; font-size: 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .nav button:hover { background: #2563eb; }
    .nav button:disabled { background: #64748b; cursor: not-allowed; }
    .nav span { color: white; font-size: 16px; }
  </style>
</head>
<body>
  <iframe id="slideFrame" src="slide1.html"></iframe>
  <div class="nav">
    <button id="prev" onclick="navigate(-1)">← Previous</button>
    <span id="counter">1 / 6</span>
    <button id="next" onclick="navigate(1)">Next →</button>
  </div>
  <script>
    let current = 1;
    const total = 6;
    function navigate(dir) {
      current += dir;
      if (current < 1) current = 1;
      if (current > total) current = total;
      document.getElementById('slideFrame').src = 'slide' + current + '.html';
      document.getElementById('counter').textContent = current + ' / ' + total;
      document.getElementById('prev').disabled = current === 1;
      document.getElementById('next').disabled = current === total;
    }
    document.getElementById('prev').disabled = true;
  </script>
</body>
</html>
